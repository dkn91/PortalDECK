<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121a">
  <title>PortalDECK</title>
  <link rel="stylesheet" href="/deck.css">
  <script src="/deck.js" defer></script>
</head>
<body>
  <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-deck" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="M7 10h4m-2-2v4m6 2h.01m3-4h.01"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-3 0h6"/></symbol>
    <symbol id="i-outlook" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></symbol>
    <symbol id="i-teams" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 19v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2m1-14a3 3 0 0 1 0 6m2 2a4 4 0 0 1 3 4v2"/></symbol>
    <symbol id="i-chrome" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5h8.3M9 14 4.8 6.7m10.2 7.1-4.1 7.1"/></symbol>
    <symbol id="i-edge" viewBox="0 0 24 24"><path d="M4 13c1-4 5-6 8-4 1 .7 1.6 1.7 1.6 3H4m0 1c0 4 3.7 7 8 7 3.3 0 6-1.6 7.4-3.5-2.7 1.5-6.4 1.6-8-.6-.7-.9-.7-2-.2-3C15 15 21 15 21 11a9 9 0 0 0-17-4"/></symbol>
    <symbol id="i-youtube" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="2"/><path d="m15 10 6-3v10l-6-3"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></symbol>
  </svg>

  <div class="deck">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-deck" xlink:href="#i-deck"/></svg></span>
        <div><h1>Portal<span>DECK</span></h1><p>DESKTOP CONTROL SURFACE</p></div>
      </div>
      <div class="system">
        <span class="connection" id="connection" data-tone="offline" role="status">Offline</span>
        <div class="clock"><time id="clock">--:--</time><span id="clock-date"></span></div>
      </div>
    </header>

    <main>
      <div class="section-label"><h2><span>01</span> Audio control</h2><span>RECORDING ENDPOINTS</span></div>
      <button class="mic" type="button" data-action="mic" aria-describedby="mic-detail" disabled>
        <span class="mic-glyph">
          <svg class="icon" aria-hidden="true"><use href="#i-mic" xlink:href="#i-mic"/></svg>
          <span class="mic-slash" aria-hidden="true"></span>
        </span>
        <span class="mic-copy">
          <strong>Microphone</strong>
          <span id="mic-detail">Recording state unavailable</span>
        </span>
        <span class="mic-state" id="mic-state" aria-live="polite">Unknown</span>
      </button>

      <div class="section-label shortcut-label"><h2><span>02</span> Quick actions</h2><span>8 SHORTCUTS</span></div>
      <div class="tiles">
        <button class="tile outlook" type="button" data-action="outlook" disabled><span class="tile-glyph"><svg class="icon" aria-hidden="true"><use href="#i-outlook" xlink:href="#i-outlook"/></svg></span><strong>Outlook</strong><span>Mail &amp; calendar</span></button>
        <button class="tile teams" type="button" data-action="teams" disabled><span class="tile-glyph"><svg class="icon" aria-hidden="true"><use href="#i-teams" xlink:href="#i-teams"/></svg></span><strong>Teams</strong><span>Chat &amp; meetings</span></button>
        <button class="tile chrome" type="button" data-action="chrome" disabled><span class="tile-glyph"><svg class="icon" aria-hidden="true"><use href="#i-chrome" xlink:href="#i-chrome"/></svg></span><strong>Chrome</strong><span>Web browser</span></button>
        <button class="tile edge" type="button" data-action="edge" disabled><span class="tile-glyph"><svg class="icon" aria-hidden="true"><use href="#i-edge" xlink:href="#i-edge"/></svg></span><strong>Edge</strong><span>Web browser</span></button>
        <button class="tile youtube" type="button" data-action="youtube" disabled><span class="tile-glyph"><svg class="icon" aria-hidden="true"><use href="#i-youtube" xlink:href="#i-youtube"/></svg></span><strong>YouTube</strong><span>Video</span></button>
        <button class="tile terminal" type="button" data-action="terminal" disabled><span class="tile-glyph"><svg class="icon" aria-hidden="true"><use href="#i-terminal" xlink:href="#i-terminal"/></svg></span><strong>Terminal</strong><span>Command line</span></button>
        <button class="tile camera" type="button" data-action="camera" disabled><span class="tile-glyph"><svg class="icon" aria-hidden="true"><use href="#i-camera" xlink:href="#i-camera"/></svg></span><strong>Camera</strong><span>Camera action</span></button>
        <button class="tile lock" type="button" data-action="lock" disabled><span class="tile-glyph"><svg class="icon" aria-hidden="true"><use href="#i-lock" xlink:href="#i-lock"/></svg></span><strong>Lock</strong><span>Lock workstation</span></button>
      </div>
    </main>

    <footer class="footer">
      <p class="feedback" id="feedback" role="status">Waiting for pairing.</p>
      <button class="pair-button" type="button" id="manage-pairing" aria-controls="pairing" aria-expanded="false">Pairing <svg class="icon" aria-hidden="true"><use href="#i-arrow" xlink:href="#i-arrow"/></svg></button>
    </footer>

    <section class="pairing" id="pairing" role="dialog" aria-modal="true" aria-labelledby="pair-title" hidden>
      <div class="pair-card">
        <p class="eyebrow">DEVICE ACCESS</p>
        <h2 id="pair-title">Pair this browser</h2>
        <p id="pair-help">Enter your pairing token. It stays in memory for this page only.</p>
        <form id="pair-form" autocomplete="off">
          <label for="pair-token">Pairing token</label>
          <input id="pair-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="pair-help pair-status" required disabled>
          <p id="pair-status" role="status"></p>
          <div class="pair-controls">
            <button type="button" id="close-pairing">Close</button>
            <button type="submit" id="submit-pairing" disabled>Connect</button>
          </div>
        </form>
      </div>
    </section>
  </div>
</body>
</html>
